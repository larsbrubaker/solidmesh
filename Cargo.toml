# solidmesh workspace: solid modeling on triangle meshes, in pure Rust (README.md says what it
# does; CLAUDE.md holds the rules).
#
# Where the architecture lives: each crate's `lib.rs` header says what the crate is, what it owns
# and the rules that span its files; each file's header says how it fits its neighbours.
#
# Members live under crates/ (plus demo/wasm, the demo site's WebAssembly bindings, never published;
# its Cargo.toml says why it is a member): the repo-wide gates (workspace-gates, tests only, never published)
# and the four kernel crates. A kernel crate's directory is the one MatterCAD has always used (so
# the history follows the files); its package and library names are the ones it publishes under:
#   crates/vector-math         -> package solidmesh-math     (lib solidmesh_math)
#   crates/clipper-library     -> package solidmesh-clipper  (lib solidmesh_clipper)
#   crates/polygon-mesh        -> package solidmesh-mesh     (lib solidmesh_mesh)
#   crates/geometry-processing -> package solidmesh          (lib solidmesh)
# Between themselves they name each other by package (`solidmesh-math = { path =
# "../vector-math", version = "0.2.0" }`). MatterCAD keeps its own dependency keys
# (`vector-math = { package = "solidmesh-math", ... }`), so its code reads `use vector_math::...`.
# `solidmesh` re-exports the other three (`solidmesh::math`, `::clipper`, `::mesh`).
# They reach the sibling checkouts beside this repository (manifold-rust, clipper2-rust,
# tess2-rust) by path, `../../../<sibling>`, each with a version floor (`{ path, version }`), so
# a stale sibling checkout stops the build at resolve time and the published manifests keep only
# the version. A new member also takes the workspace lints; the workspace-gates test
# `workspace_members` fails otherwise.
[workspace]
resolver = "2"
members = [
    "crates/vector-math",
    "crates/clipper-library",
    "crates/polygon-mesh",
    "crates/geometry-processing",
    "crates/workspace-gates",
    "demo/wasm",
]

# Every member inherits these with `<key>.workspace = true`. `readme` is relative to this
# directory, so a crate without a README of its own publishes the repository's.
[workspace.package]
version = "0.2.0"
edition = "2021"
license = "BSD-2-Clause"
authors = ["Lars Brubaker <larsbrubaker@matterhackers.com>"]
repository = "https://github.com/larsbrubaker/solidmesh"
homepage = "https://github.com/larsbrubaker/solidmesh"
readme = "README.md"

# Lints every member opts into with `[lints] workspace = true` (the workspace-gates test
# `workspace_members` refuses a member without it). Nothing lands half-built: a `todo!()` or
# `unimplemented!()` is a stub, so clippy refuses both; build the missing piece (or the dependency
# it waits on) first. `unsafe` is used only where there is no safe alternative, and every `unsafe`
# block carries a `// SAFETY:` comment stating the invariant that makes it sound, so a reader can
# check it; clippy refuses a block without one (an `unsafe fn` without a `# Safety` section is
# already refused by the default `missing_safety_doc`). Only these three lints differ from
# clippy's defaults; `clippy.toml` holds the refused calls.
[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

# ---------------------------------------------------------------------------
# Debug-build optimization. BOTH sections below are required — do not "simplify" by deleting
# either one.
#
# `[profile.dev.package."*"]` applies to DEPENDENCIES ONLY; Cargo does not apply it to workspace
# members. But generic and `#[inline]` code from dependencies (manifold-rust's kernel, the
# vector math, iterator adaptors) is monomorphized into the *calling* crate, so those
# instantiations are codegen'd inside our workspace members and inherit the member's opt-level.
# With the member opt-level left at 0, the dependency override is silently defeated in exactly
# the hottest code path, and the kernel's tests (booleans, bevels, repair over real meshes) run
# many times slower than they need to. `debug-assertions` are untouched, so assertions still fire.
#
# opt-level 1 (not 2) for workspace members is a deliberate balance: it recovers essentially all
# of the runtime win while keeping incremental compiles fast, since member crates are the ones we
# recompile constantly.
#
# No debug info, for members and dependencies alike: on macOS debug info is "unpacked" by default,
# so every codegen unit's `.o` stays in `target/debug/deps` and incremental builds add thousands
# per test binary, which slows every test process's start once nextest runs dozens at once. Panic
# messages keep their file:line (the panic location is compiled in, not read from debug info);
# backtraces show function names without lines. To step through with a debugger, set
# `debug = true` in both sections locally.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 2
debug = false
