# Publishes solidmesh's crates to crates.io from GitHub's network.
#
# Same route as manifold-rust's, agg-rust's and agg-gui's publish workflows: the development
# machine's network path drops HTTPS uploads larger than ~1.1MB, and publishing from CI keeps the
# token off the machine.
#
# Requires the repository secret CARGO_REGISTRY_TOKEN (a crates.io token with the publish-new and
# publish-update scopes); scripts/set-crates-token.ps1 stores it.
#
# Run it from the Actions tab (or `gh workflow run publish --repo larsbrubaker/solidmesh`). The
# `crate` input names one workspace package, or `all` to publish every publishable member in
# dependency order (cargo publish --workspace), which is how a release that bumps several crates
# goes out. A version already on crates.io is refused by crates.io, so bump before publishing.
# workspace-gates (the repository's gates, tests only) sets `publish = false`, so `all` skips it.
#
# manifold-rust, clipper2-rust and tess2-rust are `{ version, path }` dependencies. Cargo needs the
# sibling checkouts beside solidmesh to load the workspace (the crates reach them as
# ../../../<sibling> from crates/<crate>), so they are checked out next to it; the published
# manifests keep only the `version`, and cargo's verify build resolves them from crates.io. So
# when solidmesh needs a newer sibling, publish that sibling first, then raise the version
# requirement here.
name: publish

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Package to publish, or 'all' for every publishable workspace member"
        required: true
        default: "all"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: solidmesh
    steps:
      - name: Checkout solidmesh
        uses: actions/checkout@v7
        with:
          path: solidmesh

      - name: Checkout manifold-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/manifold-rust
          path: manifold-rust

      - name: Checkout clipper2-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/clipper2-rust
          path: clipper2-rust

      - name: Checkout tess2-rust
        uses: actions/checkout@v7
        with:
          repository: larsbrubaker/tess2-rust
          path: tess2-rust

      # rust-toolchain.toml pins the version (the one CI tests with); with no argument rustup
      # installs exactly that (the step runs inside the checkout, so it sees it).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      # A tree whose tests fail never reaches crates.io. The tests run exactly as CI runs them:
      # cargo-nextest with .config/nextest.toml's `ci` profile (every test in its own process, as
      # the tests that read process-wide counters expect), then the doctests, which nextest does
      # not run.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: Run tests
        run: cargo nextest run --workspace --profile ci
      - name: Run doctests
        run: cargo test --workspace --doc

      # cargo publish verifies each packaged tarball by building it on its own, against the
      # crates.io siblings, before uploading.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE: ${{ github.event.inputs.crate }}
        # A token piped into the secret from a Windows shell can arrive with a line ending, a
        # byte-order mark or UTF-16 null bytes around it, which cargo refuses as header
        # characters. crates.io tokens are ASCII letters and digits ("cio" + 32), so keep only
        # those; the log shows the cleaned length and prefix check, never the token.
        run: |
          CARGO_REGISTRY_TOKEN="$(printf '%s' "$CARGO_REGISTRY_TOKEN" | LC_ALL=C tr -cd 'A-Za-z0-9')"
          export CARGO_REGISTRY_TOKEN
          case "$CARGO_REGISTRY_TOKEN" in cio*) prefix=yes ;; *) prefix=no ;; esac
          echo "token: ${#CARGO_REGISTRY_TOKEN} characters after cleaning; starts with cio: $prefix"
          if [ "$CRATE" = "all" ]; then
            cargo publish --workspace
          else
            cargo publish -p "$CRATE"
          fi
