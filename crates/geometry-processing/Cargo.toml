# geometry-processing: MatterCAD.GeometryProcessing, the bevel/fillet kernel (topology, path bevels,
# the bevel itself). Pure geometry over polygon-mesh and vector-math with no scene, UI or app
# dependency, so it builds for wasm32-unknown-unknown and is testable without a GPU. Slices land
# bottom-up (docs/PORTING_PLAN.md, Phase 5C): Topology first.
[package]
name = "geometry-processing"
description = "Port of MatterCAD.GeometryProcessing: the bevel/fillet kernel for mattercad-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "geometry_processing"
path = "src/lib.rs"

[dependencies]
agg-path = { path = "../agg-path" }
vector-math = { path = "../vector-math" }
polygon-mesh = { path = "../polygon-mesh" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
