# geometry-processing, published as solidmesh: the bevel/fillet kernel (topology, path bevels,
# the bevel itself), the entry point of the solidmesh library, which re-exports the other three
# crates. Pure geometry over polygon-mesh and vector-math with no scene, UI or app dependency, so
# it builds for wasm32-unknown-unknown and is testable without a GPU.
[package]
name = "solidmesh"
description = "Solid modeling on triangle meshes in pure Rust: fillets and chamfers on mesh edges, corners and outlines that keep closed solids closed, over solidmesh-mesh's booleans, repair and implicit operations; builds for wasm32"
keywords = ["mesh", "fillet", "chamfer", "cad", "geometry"]
categories = ["graphics", "mathematics", "science", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# The tests and their fixtures stay in the repository: they read data files and the kernel's
# hidden internals, and a published crate needs neither (the bevel fixtures alone are ~10 MB).
exclude = ["tests/"]

[lib]
name = "solidmesh"
path = "src/lib.rs"

[dependencies]
# The Clipper 6 port, which no code here calls: `solidmesh` re-exports it as `solidmesh::clipper`
# (with `math` and `mesh`), so `solidmesh` alone is enough to depend on.
solidmesh-clipper = { path = "../clipper-library", version = "0.3.1" }
solidmesh-math = { path = "../vector-math", version = "0.3.1" }
solidmesh-mesh = { path = "../polygon-mesh", version = "0.3.1" }
indexmap = "2"
# Pure-Rust transcendental functions (sin, cos, atan2, pow, ...): std's call each platform's own
# maths library, whose last bits differ between Windows, Linux, macOS and the browser, so the
# same input would give different output by OS. `libm` is the same everywhere; the
# `platform_math` gate (crates/workspace-gates) keeps std's out of every crate's src.
libm = "0.2.16"
web-time = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
# SHA-256 for the cost tests' mesh digests (ConvexCellBoundTests), as MatterCAD's model has it.
sha2 = { version = "0.10", default-features = false }
# `Thingi10KSweep` reads the corpus' meshes straight out of their zip files (StlReader).
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# The cost rungs time the work on the test thread's own CPU clock (tests/bevel/thread_cpu_time.rs),
# which a loaded machine does not stretch as it does a wall clock. Tests only; the library itself
# still builds for wasm32-unknown-unknown with no platform crate.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# The workspace lints: `todo!()` and `unimplemented!()` are refused everywhere (root Cargo.toml).
[lints]
workspace = true
