# geometry-processing: the bevel/fillet kernel (topology, path bevels, the bevel itself). Pure
# geometry over polygon-mesh and vector-math with no scene, UI or app dependency, so it builds for
# wasm32-unknown-unknown and is testable without a GPU.
[package]
name = "geometry-processing"
description = "The bevel/fillet kernel and mesh topology for mattercad-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "geometry_processing"
path = "src/lib.rs"

[dependencies]
agg-path = { path = "../agg-path" }
vector-math = { path = "../vector-math" }
polygon-mesh = { path = "../polygon-mesh" }
indexmap = "2"
web-time = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
# SHA-256 for the cost tests' mesh digests (ConvexCellBoundTests), as mattercad-model has it.
sha2 = { version = "0.10", default-features = false }
# `Thingi10KSweep` reads the corpus' meshes straight out of their zip files (StlReader).
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# The cost rungs time the work on the test thread's own CPU clock (tests/bevel/thread_cpu_time.rs),
# which a loaded machine does not stretch as it does a wall clock. Tests only; the library itself
# still builds for wasm32-unknown-unknown with no platform crate.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# The workspace lints: `todo!()` and `unimplemented!()` are refused everywhere (root Cargo.toml).
[lints]
workspace = true
