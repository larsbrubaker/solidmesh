# geometry-processing, published as solidmesh: the bevel/fillet kernel (topology, path bevels,
# the bevel itself), the entry point of the solidmesh library. Pure geometry over polygon-mesh and
# vector-math with no scene, UI or app dependency, so it builds for wasm32-unknown-unknown and is
# testable without a GPU.
[package]
name = "solidmesh"
description = "Solid modeling on triangle meshes in pure Rust: fillets and chamfers on mesh edges, corners and outlines that keep closed solids closed, over solidmesh-mesh's booleans, repair and implicit operations; builds for wasm32"
keywords = ["mesh", "fillet", "chamfer", "cad", "geometry"]
categories = ["graphics", "mathematics", "science", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# Not yet on crates.io: the publish step flips this once the public API is settled.
publish = false

[lib]
name = "geometry_processing"
path = "src/lib.rs"

[dependencies]
# The Clipper 6 port and polygon helpers the bevel's shadow clip unions and tests footprints with.
clipper-library = { package = "solidmesh-clipper", path = "../clipper-library", version = "0.1.0" }
vector-math = { package = "solidmesh-math", path = "../vector-math", version = "0.1.0" }
polygon-mesh = { package = "solidmesh-mesh", path = "../polygon-mesh", version = "0.1.0" }
indexmap = "2"
# Pure-Rust trig for the 2D path bevel and the topology readings (`src/path`, `src/topology`):
# std's `sin`/`cos`/`tan`/`acos`/`atan2` call each platform's own libm, whose last bits differ, so
# a design's curves would differ by OS. `tests/platform_math_tests.rs` keeps std's out of both.
libm = "0.2.16"
web-time = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
# SHA-256 for the cost tests' mesh digests (ConvexCellBoundTests), as MatterCAD's model has it.
sha2 = { version = "0.10", default-features = false }
# `Thingi10KSweep` reads the corpus' meshes straight out of their zip files (StlReader).
zip = { version = "2.4", default-features = false, features = ["deflate"] }

# The cost rungs time the work on the test thread's own CPU clock (tests/bevel/thread_cpu_time.rs),
# which a loaded machine does not stretch as it does a wall clock. Tests only; the library itself
# still builds for wasm32-unknown-unknown with no platform crate.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# The workspace lints: `todo!()` and `unimplemented!()` are refused everywhere (root Cargo.toml).
[lints]
workspace = true
