# vector-math, published as solidmesh-math: the f64 math under solidmesh (vectors, MathHelper,
# Matrix4X4, Quaternion,
# AxisAlignedBoundingBox, Plane, Ray, Frustum, WorldView, TrackBall, Easing, Estimator, BVH,
# Color/ColorF, RectangleDouble/RectangleInt, ProgressReporter).
# std plus serde (the JSON shape `.mcx` files store the value types in) and web-time (the clock of
# ProgressReporter's yield throttle); builds for wasm32-unknown-unknown.
[package]
name = "solidmesh-math"
description = "Deterministic f64 vectors, matrices, quaternions, planes, rays, bounds and a BVH for the solidmesh mesh kernel; pure Rust, builds for wasm32"
keywords = ["geometry", "vector", "matrix", "bvh", "deterministic"]
categories = ["mathematics", "graphics", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# The tests and their fixtures stay in the repository; the package is the library alone.
exclude = ["tests/"]

[lib]
name = "solidmesh_math"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# The clock (std natively, `performance.now`/`Date.now` in the browser) for ProgressReporter's
# yield throttle; std's `Instant::now` panics on wasm32. MIT/Apache-2.0, already in the workspace.
web-time = "1"

[dev-dependencies]
serde_json = "1"

# The workspace lints: `todo!()` and `unimplemented!()` are refused everywhere (root Cargo.toml).
[lints]
workspace = true
