# vector-math: agg-sharp's VectorMath (vectors, MathHelper, Matrix4X4, Quaternion,
# AxisAlignedBoundingBox, Plane, Ray, Frustum, WorldView, TrackBall, Easing, Estimator, BVH).
# std plus serde (Newtonsoft-shaped JSON for the value types); builds for wasm32-unknown-unknown.
[package]
name = "vector-math"
description = "Port of agg-sharp VectorMath: vectors and math helpers for mattercad-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vector_math"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
