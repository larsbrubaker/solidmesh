# vector-math: VectorMath (vectors, MathHelper, Matrix4X4, Quaternion,
# AxisAlignedBoundingBox, Plane, Ray, Frustum, WorldView, TrackBall, Easing, Estimator, BVH).
# std plus serde (the JSON shape `.mcx` files store the value types in); builds for wasm32-unknown-unknown.
[package]
name = "vector-math"
description = "VectorMath: vectors, matrices and math helpers for mattercad-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "vector_math"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

# The workspace lints: `todo!()` and `unimplemented!()` are refused everywhere (root Cargo.toml).
[lints]
workspace = true
