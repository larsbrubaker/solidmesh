# polygon-mesh: agg-sharp's PolygonMesh (Mesh, faces, edges, measurements, Platonic solids, STL).
# Depends only on vector-math; builds for wasm32-unknown-unknown. CSG (manifold-rust), the
# RayTracer/BVH, Sdf/DualContouring and the other processors join in later Phase 2 slices.
[package]
name = "polygon-mesh"
description = "Port of agg-sharp PolygonMesh: triangle meshes for mattercad-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "polygon_mesh"
path = "src/lib.rs"

[dependencies]
vector-math = { path = "../vector-math" }
