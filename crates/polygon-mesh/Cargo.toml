# polygon-mesh, published as solidmesh-mesh: solidmesh's triangle meshes (Mesh, faces, edges,
# measurements, Platonic solids, STL).
# Depends on vector-math, for CSG (`csg`) the sibling manifold-rust checkout, and for slicing the
# sibling clipper2-rust checkout; builds for wasm32-unknown-unknown. The ray tracer's trace path
# lives in `ray_tracer`, the signed distance fields in `sdf` and `dual_contouring`, and the mesh
# processors in `processors`.
[package]
name = "solidmesh-mesh"
description = "Triangle meshes for solid modeling: welding, winding and measures, booleans on manifold-rust, repair, SDF and implicit meshing, convex hulls, extrusion and revolution of 2D outlines, slicing, ray tracing and STL; pure Rust, builds for wasm32"
keywords = ["mesh", "csg", "boolean", "geometry", "stl"]
categories = ["graphics", "mathematics", "rendering::data-formats", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# The tests and their fixtures stay in the repository; the package is the library alone.
exclude = ["tests/"]

[lib]
name = "solidmesh_mesh"
path = "src/lib.rs"

[dependencies]
# Pure-Rust transcendental functions (sin, cos, atan2, pow, ...): std's call each platform's own
# maths library, whose last bits differ between Windows, Linux, macOS and the browser, so the
# same input would give different output by OS. `libm` is the same everywhere; the
# `platform_math` gate (crates/workspace-gates) keeps std's out of every crate's src.
libm = "0.2.16"
solidmesh-math = { path = "../vector-math", version = "0.3.1" }
# The ClipperLib polygon helpers and the Clipper 6 port they run on (`clipper_library`), which
# slicing, stitching, extrude and revolve share with MatterCAD's DataConverters2D.
solidmesh-clipper = { path = "../clipper-library", version = "0.3.1" }
# The boolean kernel: a path dependency on the sibling checkout (../manifold-rust,
# github.com/larsbrubaker/manifold-rust), like the other siblings, so an upstream fix is usable
# at once.
# Pure Rust and wasm-capable; its rayon parallelism is opt-in (below).
manifold-rust = { path = "../../../manifold-rust", version = "0.19.2" }
# The integer polygons slicing works in: Clipper2's `Path64`/`Paths64`
# (the union itself runs on clipper-library's Clipper 6 port), from the sibling checkout (../clipper2-rust, github.com/larsbrubaker/clipper2-rust).
clipper2-rust = { path = "../../../clipper2-rust", version = "1.2.0" }
# The SGI GLU tessellator for `CachedTesselator`: tess2-rust, from the sibling checkout (../tess2-rust, github.com/larsbrubaker/tess2-rust).
tess2-rust = { path = "../../../tess2-rust", version = "1.2.1" }

# Native hosts get the kernel's `parallel` feature; the browser does not, because
# wasm32-unknown-unknown has no threads to schedule on. Only determinism-preserving sites are parallel, so the geometry is identical.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
manifold-rust = { path = "../../../manifold-rust", version = "0.19.2", features = ["parallel"] }

[dev-dependencies]
# Parses and validates the flat tree's WGSL compute traversal (`ray_tracer::flat_tree`) in a test,
# so a shader that would not compile fails here and not only in a browser. Only the WGSL front end
# and the validator: no GPU, no native code.
naga = { version = "29", default-features = false, features = ["wgsl-in"] }

# The workspace lints: `todo!()` and `unimplemented!()` are refused everywhere (root Cargo.toml).
[lints]
workspace = true
