# polygon-mesh: agg-sharp's PolygonMesh (Mesh, faces, edges, measurements, Platonic solids, STL).
# Depends on vector-math and, for CSG (`csg`), the sibling manifold-rust checkout; builds for
# wasm32-unknown-unknown. The RayTracer/BVH, Sdf/DualContouring and the other processors join in
# later Phase 2 slices.
[package]
name = "polygon-mesh"
description = "Port of agg-sharp PolygonMesh: triangle meshes for mattercad-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "polygon_mesh"
path = "src/lib.rs"

[dependencies]
vector-math = { path = "../vector-math" }
# The boolean kernel: a path dependency on the sibling checkout (../manifold-rust,
# github.com/larsbrubaker/manifold-rust), like agg-gui, so an upstream fix is usable at once.
# Pure Rust and wasm-capable; its rayon parallelism is opt-in (below).
manifold-rust = { path = "../../../manifold-rust" }

# Native hosts get the kernel's `parallel` feature, as agg-sharp's ManifoldKernel turns
# ManifoldParallel on everywhere but the browser: wasm32-unknown-unknown has no threads to
# schedule on. Only determinism-preserving sites are parallel, so the geometry is identical.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
manifold-rust = { path = "../../../manifold-rust", features = ["parallel"] }
