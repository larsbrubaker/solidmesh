# clipper-library, published as solidmesh-clipper: the Clipper 6.4.2 port (`clipper6`) and the integer polygon helpers on
# clipper2-rust's `Point64`/`Path64`/`Paths64` that run it, the winding correction and the curve
# tolerance size rule. std plus clipper2-rust (the integer types) and vector-math (the fixed-tie
# sort and `RectangleDouble`); builds for wasm32-unknown-unknown. The mesh kernel (polygon-mesh,
# geometry-processing) uses it directly, and MatterCAD's 2D path model re-exports it.
[package]
name = "solidmesh-clipper"
description = "A pure-Rust port of the Clipper 6.4.2 polygon clipper (booleans, offsets, simplification) with integer polygon helpers on clipper2-rust's types, for the solidmesh mesh kernel"
keywords = ["clipper", "polygon", "boolean", "offset", "geometry"]
categories = ["algorithms", "graphics", "mathematics", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# The tests and their fixtures stay in the repository; the package is the library alone.
exclude = ["tests/"]

[lib]
name = "solidmesh_clipper"
path = "src/lib.rs"

[dependencies]
# Pure-Rust transcendental functions (sin, cos, atan2, pow, ...): std's call each platform's own
# maths library, whose last bits differ between Windows, Linux, macOS and the browser, so the
# same input would give different output by OS. `libm` is the same everywhere; the
# `platform_math` gate (crates/workspace-gates) keeps std's out of every crate's src.
libm = "0.2.16"
# The fixed-order introsort Clipper 6's intersection list is ordered with, and `RectangleDouble`
# (the polygons' bounds in path units).
solidmesh-math = { path = "../vector-math", version = "0.2.8" }
# The integer polygon types the helpers speak: Clipper2's `Point64`/`Path64`/`Paths64` and enums,
# from the sibling checkout (../clipper2-rust, github.com/larsbrubaker/clipper2-rust). The
# clipping itself is the Clipper 6 port in src/clipper6.
clipper2-rust = { path = "../../../clipper2-rust", version = "1.2.0" }

# The workspace lints: `todo!()` and `unimplemented!()` are refused everywhere (root Cargo.toml).
[lints]
workspace = true
