# clipper-library: the Clipper 6.4.2 port (`clipper6`) and the integer polygon helpers on
# clipper2-rust's `Point64`/`Path64`/`Paths64` that run it, the winding correction and the curve
# tolerance size rule. std plus clipper2-rust (the integer types) and vector-math (the fixed-tie
# sort and `RectangleDouble`); builds for wasm32-unknown-unknown. MatterCAD's path model
# re-exports it, and the mesh kernel (polygon-mesh, geometry-processing) uses it directly.
[package]
name = "clipper-library"
description = "Clipper 6.4.2 port and integer polygon helpers for mattercad-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "clipper_library"
path = "src/lib.rs"

[dependencies]
# The fixed-order introsort Clipper 6's intersection list is ordered with, and `RectangleDouble`
# (the polygons' bounds in path units).
vector-math = { path = "../vector-math" }
# The integer polygon types the helpers speak: Clipper2's `Point64`/`Path64`/`Paths64` and enums,
# from the sibling checkout (../clipper2-rust, github.com/larsbrubaker/clipper2-rust). The
# clipping itself is the Clipper 6 port in src/clipper6.
clipper2-rust = { path = "../../../clipper2-rust", version = "1.2.0" }

# The workspace lints: `todo!()` and `unimplemented!()` are refused everywhere (root Cargo.toml).
[lints]
workspace = true
